name: Trigger JitPack Build on Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  trigger-jitpack:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger JitPack build
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY##*/}"
          TAG="${{ github.event.release.tag_name }}"
          echo "Triggering JitPack build for $OWNER/$REPO/$TAG"
          curl -fsS "https://jitpack.io/com/github/$OWNER/$REPO/$TAG/build.log" \
            -o /tmp/jitpack.log || true
          tail -n +1 /tmp/jitpack.log || true
    
    
